spring.application.name=trading-app-backend
server.port=8080

# H2 In-Memory Database (swap for PostgreSQL in production)
spring.datasource.url=jdbc:h2:mem:tradingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# JWT
app.jwt.secret=trading-app-super-secret-key-change-this-in-production-make-it-long
app.jwt.expiration=86400000

# Alpha Vantage API Key - get free key at https://www.alphavantage.co/
app.alphavantage.api-key=demo

# Starting cash balance for new users
app.trading.initial-cash=100000.00

# CORS
app.cors.allowed-origins=*
